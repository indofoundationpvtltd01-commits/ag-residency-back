<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Password Reset — AG Residency</title>
<style>
  body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #F8F5F0; }
  .container { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .header { background: #1A3C5E; padding: 32px; text-align: center; }
  .header h1 { color: #C9963F; font-family: Georgia, serif; font-size: 26px; margin: 0; }
  .body { padding: 40px 32px; text-align: center; }
  .otp-box { display: inline-block; background: #1A3C5E; color: #C9963F; font-size: 40px; font-weight: 700; letter-spacing: 12px; padding: 20px 40px; border-radius: 12px; margin: 24px 0; font-family: monospace; }
  .note { color: #6B7280; font-size: 13px; margin-top: 16px; }
  .footer { background: #1A3C5E; padding: 20px; text-align: center; }
  .footer p { color: rgba(255,255,255,0.5); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>AG Residency</h1></div>
  <div class="body">
    <h2 style="color:#1A3C5E;margin:0 0 8px;">Password Reset Request</h2>
    <p style="color:#6B7280;">Hi {{name}}, use the OTP below to reset your password.</p>
    <div class="otp-box">{{otp}}</div>
    <p class="note">⏳ This OTP expires in <strong>{{validity}}</strong>.</p>
    <p class="note">If you didn't request this, please ignore this email. Your account is safe.</p>
  </div>
  <div class="footer"><p>AG Residency | © 2025 All rights reserved.</p></div>
</div>
</body></html>
